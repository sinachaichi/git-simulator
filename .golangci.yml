version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - revive
    - gocritic
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
formatters:
  enable:
    - gofumpt
    - goimports
